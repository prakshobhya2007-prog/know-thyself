function why(c){return`<div class="ev"><span class="lb" style="margin-top:0">Data used</span><p>${c.used.join(", ")}</p><span class="lb">Method</span><p>${c.method||"Grouped comparison"}</p><span class="lb">Evidence</span>${c.ev.map(e=>`<p>• ${e}</p>`).join("")}<span class="lb">What this means</span><p>${c.mean}</p><span class="lb">Limitations</span><p>${c.limit||"Association, not causation."}</p></div>`}
function dcard(c,i){return`<div class="c"><div class="cap">${c.cat}</div><h3 style="margin:6px 0;font-size:18px;font-weight:600">${c.title}.</h3><div class="mu sm">${c.ev[c.ev.length>3?3:0]}</div>
<div style="margin-top:10px"><button class="chip ${ST.open[i]?"on":""}" onclick="ST.open[${i}]=!ST.open[${i}];draw()">Why am I seeing this?</button></div>${ST.open[i]?why(c):""}<span class="lb">Try this</span><div class="sm">${c.act}</div></div>`}
function view(){if(D.length<7)return`<h1>No data loaded.</h1><p class="sub">Import a CSV or reload the demo dataset to begin.</p><button class="b" onclick="ST.modal='imp';draw()">Import your data</button> <button class="chip" onclick="reset()">Reset demo data</button>`;
const K=keys(),dis=discover(),sl=D.filter(r=>r.sleep!=null).length,span=Math.round((D[D.length-1].date-D[0].date)/864e5)+1;
if(ST.tab=="Overview"){const h=dis[0],t=K.includes("sleep")?"sleep":K.includes("rec")?"rec":null,fs=t?K.filter(k=>k!=t).map(k=>rel(t,k)).filter(Boolean).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)):[],sel=ST.fs!=null?fs[ST.fs]:null;
return`<h1>What if your tracker told you something you didn’t know?</h1><p class="sub">${SRC=="demo"?"Demo profile: Alex, synthetic 30-day dataset.":"Analyzing your imported file."} ${t?`${sl}/${span} days with sleep data analyzed.`:""}</p>
${h?`<div class="c hero"><div class="cap">Your strongest pattern</div><h3>${h.title}.</h3><button class="chip ${ST.open.h?"on":""}" onclick="ST.open.h=!ST.open.h;draw()">Show evidence</button>${ST.open.h?why(h):""}<span class="lb">Try this</span><div class="sm">${h.act}</div></div>`:`<div class="c hero"><h3>Not enough data to identify a reliable pattern yet.</h3></div>`}
<h2>Your numbers</h2><div class="g g5">${["sleep","steps","rec","rhr","screen"].filter(k=>K.includes(k)).map(k=>{const v=vals(k),tr=trend(k);return`<div class="c"><div class="mu sm">${C(M[k].p)}</div><div class="v">${M[k].f(v[v.length-1])}</div>${tr?`<div class="sm ${(tr.pct>=0)==(k!="rhr"&&k!="screen")?"up":"dn"}">${tr.pct>=0?"↑":"↓"} ${N0(Math.abs(tr.pct))}% vs last week</div>`:`<div class="sm mu">Trend: not enough data</div>`}${sp(v.slice(-14))}</div>`}).join("")}</div>
${t&&fs.length?`<h2>What affects your ${M[t].p}?</h2><div class="c"><p class="sm mu" style="margin-top:0">Each bar is the correlation (r) with your ${M[t].p}. Tap a factor for the evidence.</p>${fs.map((o,i)=>`<div class="fr" onclick="ST.fs=${i};draw()"><span>${C(M[o.k].p)}</span><div class="tr"><i style="${o.r<0?"right":"left"}:50%;width:${Math.abs(o.r)*50}%;background:${o.r<0?"var(--dn)":"var(--up)"}"></i></div><span class="mu">${o.r.toFixed(2)}</span></div>`).join("")}
${sel?`<div class="ev"><span class="lb" style="margin-top:0">Your data shows that…</span><p>${relC(sel).title}.</p>${relC(sel).ev.map(e=>`<p>• ${e}</p>`).join("")}<p class="mu">${relC(sel).mean}</p></div>`:`<p class="sm mu">Red bars lower it, green bars raise it.</p>`}</div>`:""}`}
if(ST.tab=="Insights")return ST.boot?`<div class="ld"><span class="dot"></span>ANALYZING YOUR DATA…<br><span class="sm">Validating, extracting features, testing relationships.</span></div>`:`<h1>Things I discovered about you.</h1><p class="sub">The strongest findings, ranked by statistical strength, size and sample coverage.</p><div class="g g2">${dis.length?dis.map(dcard).join(""):`<div class="c">Not enough data to identify a reliable pattern yet.</div>`}</div>`;
if(ST.tab=="Trends")return`<h1>Trends</h1><p class="sub">Each chart answers one question.</p><button class="chip ${ST.rng==7?"on":""}" onclick="ST.rng=7;draw()">7D</button><button class="chip ${ST.rng==30?"on":""}" onclick="ST.rng=30;draw()">30D</button><div class="g g2" style="margin-top:12px">${[["sleep","How is my sleep changing?"],["rec","Is my recovery holding up?"],["steps","How active have I been?"],["rhr","Is my heart rate stable?"],["screen","How much am I on my phone?"]].filter(q=>K.includes(q[0])).map(q=>{const o=trend(q[0],ST.rng==7?7:15);return`<div class="c"><div class="cap">${q[1]}</div><div class="sm" style="margin:4px 0 8px">${o?`${C(M[q[0]].p)} ${o.pct>=0?"up":"down"} ${N0(Math.abs(o.pct))}% over the latest ${ST.rng==7?7:15} days.`:"Not enough data for a comparison."}</div>${chart(q[0],ST.rng)}</div>`}).join("")}</div>`;
if(ST.tab=="Nudges"){const n=nudges();return`<h1>Small experiments.</h1><p class="sub">Generated from your data, not from a script. Try one and see whether your data changes.</p><div class="g g2">${n.length?n.map(x=>`<div class="c"><div class="cap">${x.cat}</div><span class="lb">Observation</span><div class="sm">${x.obs}</div><span class="lb">Pattern</span><div class="sm">${x.pat}</div><span class="lb">Try this</span><div>${x.nudge}</div><span class="lb">Why</span><div class="sm mu">${x.why}. Your own data suggests this may be worth testing.</div></div>`).join(""):`<div class="c">Not enough data to suggest an experiment yet.</div>`}</div>`}
if(ST.tab=="Ask")return`<h1>Ask your data.</h1><p class="sub">Every answer is computed from the loaded dataset, with the evidence shown.</p><div class="c">${["Why was my sleep worse this week?","What affects my sleep the most?","When am I most active?","Does screen time affect my recovery?","What changed compared with last month?","What should I improve first?","What is the strongest pattern in my data?","Which days am I performing best?"].map(q=>`<button class="chip" onclick="ask(this.textContent)">${q}</button>`).join("")}
<div style="display:flex;gap:10px;margin:14px 0"><input type="text" id="q" placeholder="Ask about sleep, recovery, activity…" onkeydown="if(event.key=='Enter')ask(this.value)"><button class="b" onclick="ask(document.getElementById('q').value)">Ask</button></div>${ST.busy?`<div class="ld"><span class="dot"></span>Querying your data…</div>`:""}
${[...ST.chat].reverse().map(m=>`<div style="border-top:1px solid var(--bd);margin-top:14px;padding-top:12px"><div class="mu sm">${m.q}</div><span class="lb">Answer</span><div style="font-size:17px">${m.a}</div><span class="lb">Evidence</span>${m.ev.map(e=>`<div class="sm">• ${e}</div>`).join("")}${m.mean?`<span class="lb">What this means</span><div class="sm">${m.mean}</div>`:""}<span class="lb">Try this</span><div class="sm">${m.act}</div><span class="lb">Data used</span><div class="sm mu">${m.used.join(" · ")}</div></div>`).join("")}</div>`;
if(ST.tab=="Cycle")return cycV();if(ST.tab=="Sports")return spV();return`<h1>How it works.</h1><p class="sub">The engine finds the facts. Language only describes them.</p><div style="max-width:420px;margin:auto">${["Personal data (CSV or demo)","Validation + normalization","Feature extraction","Statistics: means, trends, Pearson r","Pattern detection + ranking","Explainable insight + evidence","Personal nudge (an experiment)","New data → loop"].map((s,i)=>(i?`<div class="ar">↓</div>`:"")+`<div class="fl">${s}</div>`).join("")}</div>
<div class="c" style="margin-top:22px"><div class="cap">AI role</div><p>An LLM may later be used only to phrase findings the engine has already computed. It must not invent them. <b>This build has no LLM connected.</b> Every sentence you see comes from the local engine and works offline.</p><div class="cap">Privacy</div><p>Raw data → local processing → derived insights → optional AI explanation, with only derived evidence ever passed on.</p></div>`}
function modal(){if(ST.modal=="priv")return`<div class="ov" onclick="if(event.target==this){ST.modal=null;draw()}"><div class="md"><button class="x" onclick="ST.modal=null;draw()">×</button><div class="cap">Data ownership</div><h3 style="font-size:22px;margin:4px 0">Your data stays yours.</h3><p class="sm">Everything is processed in this browser tab. Nothing is uploaded, stored on a server or sold. No AI service is called. Your imported file exists only in memory until you close the tab. The optional cycle and sports modules are off by default; when on, their data is handled the same way and you can switch them off and clear them at any time.</p>
<div class="fl">Raw data</div><div class="ar">↓</div><div class="fl">Local processing</div><div class="ar">↓</div><div class="fl">Derived insights</div><div class="ar">↓</div><div class="fl">Optional AI explanation (derived evidence only; not connected here)</div>
<p class="sm mu">Sources: the demo dataset is synthetic. No Apple Health or Google Fit connection exists. Only CSV import is implemented.</p><button class="b" onclick="del()">Delete my data</button> <button class="chip" onclick="reset()">Reset demo data</button></div></div>`;
if(ST.modal=="imp")return`<div class="ov" onclick="if(event.target==this){ST.modal=null;draw()}"><div class="md"><button class="x" onclick="ST.modal=null;draw()">×</button><div class="cap">Import your data</div><h3 style="font-size:22px;margin:4px 0">Upload a CSV.</h3><p class="sm mu">Needs a date column, plus any of: sleep (hours or minutes), bedtime (HH:MM), late-night screen minutes, screen time, steps, recovery, resting HR, workout. Headers are matched by name. The file never leaves your browser.</p>
<input type="file" accept=".csv,text/csv" onchange="file(this.files[0])"><div style="margin-top:10px"><button class="chip" onclick="load(sample(),'sample-messy.csv')">Try a messy sample file</button></div>
${ST.err?`<p class="dn sm">${ST.err}</p>`:""}${REP?`<div class="ev"><span class="lb" style="margin-top:0">Imported ${REP.name}</span><p>${REP.valid} valid days (${REP.from.toISOString().slice(0,10)} to ${REP.to.toISOString().slice(0,10)})</p><p>Columns detected: ${REP.cols.join(", ")||"none"}</p><p>Skipped ${REP.bad} invalid rows, merged ${REP.dup} duplicates, ${REP.miss} missing or invalid values left empty</p></div><button class="b" onclick="ST.modal=null;ST.tab='Insights';go('Insights')">See what changed</button>`:""}</div></div>`;return""}
// ===== OPTIONAL MODULES (off by default) =====
const PH=["Menstrual","Follicular","Ovulatory","Luteal"],SPS=["Basketball","Tennis","Cricket","Other"],x_=(v,f)=>v==null?"–":f(v);
function cycS(){const o={};PH.forEach(p=>{const R=D.filter(r=>r.cyc!=null&&ph(r.cyc)==p),m=k=>{const v=vals(k,R);return v.length?avg(v):null};o[p]={n:R.length,sleep:m("sleep"),rec:m("rec"),steps:m("steps"),en:m("en")}});return o}
function cycF(){const s=cycS(),P=PH.filter(p=>s[p].n>=3&&s[p].rec!=null).sort((a,b)=>s[b].rec-s[a].rec);if(P.length<2)return null;const b=P[0],w=P[P.length-1],d=s[b].rec-s[w].rec,n=P.reduce((t,p)=>t+s[p].n,0);if(d<3)return null;
return{cat:"Cycle phase",k:"cyc",score:Math.min(1,d/15)*.8,title:`Your recovery averages ${N0(s[b].rec)} in your ${b.toLowerCase()} phase and ${N0(s[w].rec)} in your ${w.toLowerCase()} phase`,ev:[`${b}: recovery ${N0(s[b].rec)} (${s[b].n} days)`,`${w}: recovery ${N0(s[w].rec)} (${s[w].n} days)`,`Difference: ${N0(d)} pts`,`Based on ${n} days with cycle data`],mean:"Your data shows a difference between phases. About one cycle is a small sample, and sleep, stress and training also move these numbers.",act:`Test it next cycle: schedule your hardest sessions in your ${b.toLowerCase()} phase, keep your ${w.toLowerCase()} phase lighter if you feel low, and see whether your recovery follows.`,used:["cycle day","recovery score"],method:"Phase averages (menstrual, follicular, ovulatory, luteal)",n,limit:"Roughly one cycle of data. Phase boundaries are estimates because cycle lengths vary. Association, not causation."}}
function cycV(){const C=ST.cyc,H=`<div class="cap">Optional module</div><h1>Cycle-aware insights.</h1>`;
if(!C.on)return`${H}<p class="sub">Off by default. Not everyone wants to share menstrual or hormonal data, so nothing about your cycle is read or analyzed until you turn this on.</p><button class="b" onclick="ST.cyc.on=true;draw()">Turn on</button>`;
if(vals("cyc").length<14)return`${H}<p class="sub">Your data has no usable cycle information. Add a cycle_day column (1 = first day of your period) and optionally energy (1 to 5).</p><button class="chip" onclick="ST.cyc.on=false;draw()">Turn off</button>`;
const s=cycS(),f=cycF(),l=D.filter(r=>r.cyc!=null).pop(),p=ph(l.cyc),a=avg(vals("rec")),
N={pcos:["PCOS / PCOD","Cycles can be irregular, so phase labels are approximate. Compare your own weeks rather than textbook phases."],thy:["Thyroid condition","Thyroid conditions can affect energy, sleep and resting heart rate on their own, so some of what you see may not be cycle-related. Your doctor is the right person to interpret changes."],pre:["Pre-diabetes / insulin resistance","Blood sugar can affect how workouts feel. This app has no glucose data and does not assess it. Ask your doctor before changing your training."]};
return`${H}<p class="sub">How your own sleep, recovery, activity and energy differ across cycle phases. Optional, local only, and not medical advice.</p>
<div class="c"><span class="lb" style="margin-top:0">Optional: anything that may change how to read your data</span>${Object.keys(N).map(k=>`<button class="chip ${C.c[k]?"on":""}" onclick="ST.cyc.c.${k}=!ST.cyc.c.${k};draw()">${N[k][0]}</button>`).join("")}${Object.keys(N).filter(k=>C.c[k]).map(k=>`<div class="ev"><p><b>${N[k][0]}.</b> ${N[k][1]}</p></div>`).join("")}</div>
<div class="c" style="margin-top:14px"><div class="cap">Today · cycle day ${l.cyc} · ${p}</div><p>${s[p].rec!=null&&s[p].rec>=a?"In your data, recovery in this phase is at or above your average, so a harder session may suit you if you feel good.":"In your data, recovery in this phase tends to run below your average, so a lighter or skill-focused session may suit you. Listen to how you feel."}</p></div>
<h2>Your phases</h2><div class="g g5">${PH.map(q=>`<div class="c"><div class="cap">${q}</div><div class="sm mu">${s[q].n} days</div><div class="sm">Sleep ${x_(s[q].sleep,hm)}</div><div class="sm">Recovery ${x_(s[q].rec,N0)}</div><div class="sm">Steps ${x_(s[q].steps,v=>N0(v).toLocaleString())}</div><div class="sm">Energy ${x_(s[q].en,v=>v.toFixed(1)+"/5")}</div></div>`).join("")}</div>
<div style="margin-top:14px">${f?dcard(f,50):`<div class="c">Not enough days per phase for a reliable comparison yet.</div>`}</div>
<p style="margin-top:14px"><button class="chip" onclick="ST.cyc={on:false,c:{}};draw()">Turn off and clear</button></p>`}
function demoS(){const mn=[60,45,75,50,60,70,45,65,55],rp=[7,5,6,8,6,7,5,8,6];return[1,4,8,11,14,18,21,25,28].map((a,i)=>({date:D[a].date,sport:SPS[i%3],min:mn[i],rpe:rp[i]}))}
function addS(){const m=+document.getElementById("spm").value,r=+document.getElementById("spr").value;if(!(m>0&&r>=1&&r<=10))return;ST.sp.s.push({date:D[D.length-1].date,sport:document.getElementById("sps").value,min:m,rpe:r});draw()}
function spV(){const S=ST.sp,H=`<div class="cap">Optional module</div><h1>Sport sessions.</h1>`;
if(!S.on)return`${H}<p class="sub">Off by default. Log basketball, tennis or cricket sessions to see your training load, how you recover after hard sessions, and a weekly target.</p><button class="b" onclick="ST.sp.on=true;draw()">Turn on</button>`;
S.s=S.s||(SRC=="demo"&&D.length>=30?demoS():[]);const dy=864e5,L=+D[D.length-1].date,ss=S.s.map(x=>({...x,ld:x.min*x.rpe})),t0=Math.min(+D[0].date,...ss.map(x=>+x.date)),wks=Math.max(1,((L-t0)/dy+1)/7),ch=ss.reduce((t,x)=>t+x.ld,0)/wks,ac=ss.filter(x=>L-x.date<7*dy).reduce((t,x)=>t+x.ld,0),ra=ch?ac/ch:0,
pr=ss.map(x=>({ld:x.ld,r:(D.find(r=>+r.date==+x.date+dy)||{}).rec})).filter(x=>x.r!=null),m=pr.length?med(pr.map(x=>x.ld)):0,hi=pr.filter(x=>x.ld>m),lo=pr.filter(x=>x.ld<=m);
return`${H}<p class="sub">Training load = minutes × effort (1 to 10). ${SRC=="demo"?"Demo sessions shown.":"Add your own sessions below."}</p>
${ss.length?`<div class="g g5"><div class="c"><div class="mu sm">Load, last 7 days</div><div class="v">${N0(ac)}</div></div><div class="c"><div class="mu sm">Usual weekly load</div><div class="v">${N0(ch)}</div></div><div class="c"><div class="mu sm">This week vs usual</div><div class="v">${ra.toFixed(2)}×</div><div class="sm">${ra<.8?"Lighter than usual.":ra<=1.3?"In line with your usual load.":"Well above your usual load. Balance it with easier days."}</div></div><div class="c"><div class="mu sm">Suggested target, next 7 days</div><div class="v">${N0(ch*.9)}–${N0(ch*1.1)}</div><div class="sm">Within about 10% of your usual load.</div></div></div>
${hi.length>=2&&lo.length>=2?`<div class="c" style="margin-top:14px"><span class="lb" style="margin-top:0">Recovery after sessions</span><p>Next-day recovery averaged ${N0(avg(hi.map(x=>x.r)))} after harder sessions and ${N0(avg(lo.map(x=>x.r)))} after lighter ones (${pr.length} sessions). A short window, and an association only.</p></div>`:""}
<h2>Sessions</h2><div class="c">${[...ss].reverse().map(x=>`<div class="sm">${x.date.toISOString().slice(0,10)} · ${x.sport} · ${x.min} min · effort ${x.rpe}/10 · load ${x.ld}</div>`).join("")}</div>`:`<div class="c">No sessions yet. Add one below.</div>`}
<h2>Add a session</h2><div class="c"><select id="sps">${SPS.map(q=>`<option>${q}</option>`).join("")}</select> <input type="text" id="spm" placeholder="Minutes" size="8"> <input type="text" id="spr" placeholder="Effort 1-10" size="10"> <button class="b" onclick="addS()">Add</button></div>
<div class="c" style="margin-top:14px"><span class="lb" style="margin-top:0">What this can’t see</span><p class="sm">Spatial awareness and decision-making can’t be measured from ordinary phone or watch data. They would need video or sensor analysis, which this MVP does not have. Here, load and recovery come from what you log and from your tracker.</p></div>
<p style="margin-top:14px"><button class="chip" onclick="ST.sp={on:false,s:null};draw()">Turn off and clear</button></p>`}
function draw(){app.innerHTML=`<nav><span class="logo">KNOW <i>THYSELF</i></span>${T.map(t=>`<button class="t ${t==ST.tab?"on":""}" onclick="go('${t}')">${t}</button>`).join("")}<span class="sp"></span><span class="pill" style="border-color:var(--ac);color:var(--ac)">${SRC=="demo"?"DEMO · synthetic data":"YOUR DATA · "+SRC}</span><button class="pill" onclick="ST.modal='imp';ST.err='';draw()">Import data</button><button class="pill" onclick="ST.modal='priv';draw()"><span class="dot"></span>Your data stays yours</button></nav>${view()}<p class="sm mu" style="margin-top:44px">Wellness insights only. Not medical advice. Findings are associations, not causes.</p>${modal()}`}
function go(t){ST.tab=t;ST.open={};ST.fs=null;if(t=="Insights"){ST.boot=true;setTimeout(()=>{ST.boot=false;draw()},900)}draw()}
function ask(q){if(!q.trim())return;ST.busy=true;draw();setTimeout(()=>{ST.busy=false;ST.chat.push({q:q.replace(/</g,"&lt;"),...answer(q)});draw()},700)}
function load(t,n){const r=imp(t,n);if(r.err){ST.err=r.err;REP=null}else{ST.sp.s=null;D=r.rows;SRC=n;REP=r.rep;ST.err="";ST.chat=[];ST.open={}}draw()}
function file(f){if(!f)return;const r=new FileReader();r.onload=()=>load(String(r.result),f.name);r.readAsText(f)}
function reset(){ST.sp.s=null;D=gen();SRC="demo";REP=null;ST.modal=null;ST.chat=[];ST.open={};draw()}
function del(){D=[];SRC="none";REP=null;ST.modal=null;ST.chat=[];draw()}
D=gen();draw();
</script></body></html>
